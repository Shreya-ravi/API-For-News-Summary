<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ಉದಯವಾಣಿ Login</title>
<style>
body{
    margin:0;
    background:#e6f2ff;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.card{
    background:white;
    padding:40px;
    width:350px;
    border-radius:15px;
    box-shadow:0 8px 25px rgba(0,0,0,0.1);
    text-align:center;
}
h1{
    color:#0066cc;
    margin-bottom:5px;
}
h3{
    color:grey;
    margin-bottom:25px;
}
input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
}
button{
    width:100%;
    padding:12px;
    background:#0066cc;
    color:white;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}
button:hover{
    background:#004c99;
}
</style>
</head>
<body>
<div class="card">
    <h1>ಉದಯವಾಣಿ</h1>
    <h3>Login</h3>
    <form method="post" action="/login">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button>Login</button>
    </form>
</div>
</body>
</html>
